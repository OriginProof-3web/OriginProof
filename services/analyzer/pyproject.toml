[project]
name = "originproof-analyzer"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.142.2,<0.143",
  "openai>=2.54,<3",
  "originproof-core",
  "pillow>=12.3,<13",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<0.35",
]

[tool.uv.sources]
originproof-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
originproof_analyzer = ["prompts/*.md"]
