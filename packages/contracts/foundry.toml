[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100

[fuzz]
runs = 512

# Aliases keep provider-keyed URLs off the command line: `cast chain-id --rpc-url sepolia`.
# SEPOLIA_RPC_URL is read from the environment only when the alias is used.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"
