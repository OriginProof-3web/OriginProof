name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - integration
      - "phase/**"
      - "docs/**"
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  python-quality:
    env:
      PYTHONPATH: apps/api/src:packages/python:services/analyzer/src:services/indexer/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.13"
      - name: Synchronize locked dependencies
        run: uv sync --all-packages --all-groups --locked
      - name: Validate repository structure
        run: uv run python scripts/ci/validate_structure.py
      - name: Verify generated contracts are current
        run: |
          make generate
          git diff --exit-code -- packages/schemas/generated fixtures/golden packages/contracts/test/generated/WalletGolden.sol fixtures/synthetic/shared_contract_cases_v1.json packages/contracts/abi
      - name: Run Python tests and lint
        run: |
          uv run pytest
          uv run ruff check apps packages services scripts
          uv run python -m compileall -q apps packages services scripts
      - name: Run web demo checks
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter originproof-demo-web lint
          pnpm --filter originproof-demo-web typecheck
          pnpm --filter originproof-demo-web test
          pnpm --filter originproof-demo-web build
          pnpm --filter originproof-demo-web exec playwright install --with-deps chromium
          pnpm --filter originproof-demo-web test:e2e

  c-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Install fixed dependencies
        run: |
          uv sync --all-packages --all-groups --locked
          cd packages/contracts
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 foundry-rs/forge-std@v1.16.2
      - name: Audit locked Python dependencies
        run: make security
      - name: Recover actual API processes and restore disposable database
        run: make test-w6-c-live

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Install locked Foundry dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 \
            foundry-rs/forge-std@v1.16.2
      - name: Run Foundry tests
        run: forge test
