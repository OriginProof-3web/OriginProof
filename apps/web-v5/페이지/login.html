<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>OriginProof — 로그인</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script>try{if(/[?&]theme=light/.test(location.search)||localStorage.getItem("op5.theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="stylesheet" href="auth5.css">
</head>
<body>
<canvas id="beyond-horizon-canvas" aria-hidden="true"></canvas>
<header class="a-top">
  <a class="a-brand" href="entry.html"><img class="logo-dark" src="assets/logo-mark-light.svg" alt="" width="30" height="23"><img class="logo-light" src="assets/logo-mark-dark.svg" alt="" width="30" height="23">OriginProof</a>
  <div class="a-tools">
    <a class="a-pill" href="join.html">회원가입</a>
    <button type="button" class="a-pill a-icon" id="themeBtn" aria-label="밝은 모드로 바꾸기" title="밝은 모드로 바꾸기"><svg class="ico-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ico-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>
<main class="a-main">
  <section class="a-card" aria-labelledby="t">
    <img class="a-logo logo-dark" src="assets/logo-full-light.svg" alt="">
    <img class="a-logo logo-light" src="assets/logo-full-dark.svg" alt="">
    <h1 id="t">로그인</h1>
    <p class="a-sub">정확한 확인(기관 기록 대조)과 AI 분석은 로그인 후에 쓸 수 있어요.</p>
    <p class="a-msg" id="msg" role="alert"></p>
    <form id="form" novalidate autocomplete="on">
      <div class="a-field"><label for="username">계정 이름</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120" required></div>
      <div class="a-field"><label for="password">비밀번호</label>
        <div class="a-key"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button type="button" id="peek" aria-pressed="false">보기</button></div>
      </div>
      <button class="a-btn" type="submit" id="submit">로그인</button>
    </form>
    <div class="a-divider">또는</div>
    <a class="a-btn ghost" style="display:grid;place-items:center;text-decoration:none" href="business.html">비회원으로 둘러보기</a>
    <div class="a-row"><span>계정이 없나요?</span><a href="join.html">회원가입</a></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id),form=$("form"),msg=$("msg"),btn=$("submit");
  const served=/^https?:$/.test(location.protocol);
  const next=new URLSearchParams(location.search).get("next")==="business.html"?"business.html":"business.html"; // 돌아갈 곳은 메인만 허용(열린 리다이렉트 방지)
  const ERR={INVALID_CREDENTIALS:"계정 이름이나 비밀번호가 맞지 않아요.",ACCOUNT_DISABLED:"사용이 정지된 계정이에요. 운영자에게 문의해 주세요.",RATE_LIMITED:"시도가 많아 잠시 막혔어요. 잠시 뒤 다시 해 주세요."};
  function show(kind,text){msg.className="a-msg show "+kind;msg.textContent=text}
  $("peek").addEventListener("click",function(){const p=$("password"),on=p.type==="password";p.type=on?"text":"password";this.textContent=on?"숨기기":"보기";this.setAttribute("aria-pressed",String(on))});
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const username=$("username").value.trim(),password=$("password").value;
    if(!username||!password){show("err","계정 이름과 비밀번호를 모두 넣어 주세요.");(username?$("password"):$("username")).focus();return}
    if(!served){show("err","서버에 연결되지 않아 로그인할 수 없어요.");return}
    btn.disabled=true;btn.textContent="확인 중…";
    try{
      const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch("/api/v1/auth/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({username,password}),signal:ctl.signal});
      clearTimeout(t);
      if(r.ok){$("password").value="";show("ok","로그인했어요. 메인 화면으로 이동해요.");location.href=next;return}
      let code="";try{const d=await r.json();code=typeof d.detail==="string"?d.detail:""}catch(_){}
      show("err",ERR[code]||(r.status===401?ERR.INVALID_CREDENTIALS:r.status===429?ERR.RATE_LIMITED:"로그인하지 못했어요(HTTP "+r.status+")."));
    }catch(_){show("err","서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.")}
    finally{btn.disabled=false;btn.textContent="로그인"}
  });
  // 밝은·어두운 모드(입장·메인과 같은 설정)
  const tb=$("themeBtn"),paint=()=>{const l=document.documentElement.dataset.theme==="light",t=l?"어두운 모드로 바꾸기":"밝은 모드로 바꾸기";tb.title=t;tb.setAttribute("aria-label",t)};
  tb.addEventListener("click",()=>{const l=document.documentElement.dataset.theme!=="light";document.documentElement.dataset.theme=l?"light":"dark";try{localStorage.setItem("op5.theme",l?"light":"dark")}catch(_){}paint()});paint();
  $("username").focus();
})();
</script>
<script src="beyond-horizon.js"></script>
</body>
</html>
