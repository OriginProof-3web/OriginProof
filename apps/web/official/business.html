<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OriginProof — 기업 메인</title>
<link rel="stylesheet" href="business.bundle.css">
<link rel="stylesheet" href="business-workspace.css">
<style>
:root{--ink:#eeeeF2;--muted:#a0a2ac;--line:#282830;--paper:#08080a;--green:#86cda8;--green-soft:#193026;--nav:224px;--dock:#1d1e20;--dock-pill:#343638}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);transition:grid-template-columns .28s cubic-bezier(.16,1,.3,1)}
.main{position:relative;min-width:0;min-height:100vh;background:#08080a}.topbar{height:57px;position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 27px;border-bottom:1px solid #282830;background:#111115d9;backdrop-filter:blur(12px);z-index:2}.crumb{font-size:11px;color:#90939e}.crumb b{color:#d1d3dc;font-weight:600}.top-right{display:flex;align-items:center;gap:10px}.secure{display:flex;align-items:center;gap:6px;color:#a0a3ad;font-size:10px}.secure i{width:6px;height:6px;border-radius:50%;background:#66a77c}.top-avatar{width:26px;height:26px;border-radius:50%;background:#21352b;color:#a0dbba;display:grid;place-items:center;font-size:10px;font-weight:700}.canvas{min-height:100vh;padding:0}.empty-state{text-align:center;max-width:380px;transform:translateY(-8px)}.empty-mark{height:52px;width:52px;margin:0 auto 17px;border:1px solid #2b2b34;border-radius:17px;background:#111115;color:#86cda8;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 22px #1a322308}.empty-state h1{margin:0;color:#e3e5ec;font-size:17px;font-weight:620;letter-spacing:-.4px}.empty-state p{margin:7px 0 0;color:#a0a3ad;font-size:11px}.canvas-note{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:5px;background:#1d1d24;color:#a0a3ad;font-size:9px;letter-spacing:.2px;white-space:nowrap}
.bottom-dock-wrap{position:absolute;z-index:6;left:50%;top:24px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px)}.bottom-dock{display:flex;align-items:center;gap:2px;padding:4px;border:1px solid #383a3d;border-radius:999px;background:var(--dock);box-shadow:0 12px 34px #14161924}.dock-item{height:39px;min-width:96px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid transparent;border-radius:999px;background:transparent;color:#95999d;font-size:12px;font-weight:550;white-space:nowrap;transition:background .16s,color .16s,border-color .16s}.dock-item:hover{color:#e4e6e7}.dock-item.active{border-color:#494b4e;background:#252729;color:#f5f6f6;box-shadow:inset 0 1px 2px #0005}.dock-icon{font-size:14px;line-height:1;color:inherit}.canvas-context{position:fixed;left:50%;bottom:83px;transform:translateX(-50%);color:#a0a3ad;font-size:10px;white-space:nowrap;transition:left .28s cubic-bezier(.16,1,.3,1)}.app.collapsed .canvas-context{left:calc(50% + 27px)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}

.landing{--stream-size:clamp(2.8rem,6.5vw,4.6rem);position:fixed;inset:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f4f4f4;overflow:hidden;isolation:isolate}.landing:before{content:"";position:absolute;z-index:0;inset:0;background:radial-gradient(ellipse 52% 21% at 50% 80.25%,#b79bfa38 0%,#6d529744 20%,#3a2a782b 42%,transparent 76%),radial-gradient(ellipse 23% 12% at 50% 79.25%,#ffffff30 0%,#c7b2ff22 25%,transparent 72%);filter:blur(18px);animation:horizon-breathe 8s ease-in-out infinite alternate}.landing:after{content:"";position:absolute;z-index:0;top:80.25%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent 4%,#78649b22 25%,#b79bfa88 42%,#fff 50%,#b79bfa88 58%,#78649b22 75%,transparent 96%);box-shadow:0 0 7px #b79bfa99,0 0 25px #8c70ce66;opacity:.78}#beyond-horizon-canvas{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}.text-stream{position:relative;z-index:2;transform:translateY(-38px);width:min(100%,720px);height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem}.stream-prefix{margin:0;color:#a9a2b8;font-size:clamp(.8rem,1.7vw,1rem);font-weight:400;letter-spacing:.3em;text-transform:uppercase}.stream-viewport{position:relative;width:100%;height:calc(var(--stream-size) * 2.2);flex-shrink:0;overflow:hidden;text-align:center;mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 70%,transparent 100%)}.stream-track{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;font-size:var(--stream-size);font-weight:600;line-height:1.1;letter-spacing:-.035em;color:#fff;mix-blend-mode:difference;text-shadow:none;will-change:transform}.stream-copy{display:flex;flex-direction:column}.stream-copy a{display:block;padding:6px 0;color:inherit;text-decoration:none;white-space:nowrap;cursor:pointer}.landing[hidden],.hide{display:none!important}
@keyframes horizon-breathe{from{transform:scaleX(.92);opacity:.72}to{transform:scaleX(1.08);opacity:1}}
@media(prefers-reduced-motion:reduce){.landing:before{animation:none}.stream-track{transform:none!important}.stream-copy[aria-hidden="true"]{display:none}.stream-viewport{height:auto;mask-image:none;-webkit-mask-image:none}.stream-copy:not(:first-child){display:none!important}}
@media(max-width:760px){.landing{--stream-size:clamp(2.6rem,11vw,4rem)}.text-stream{height:400px;width:100%}}

</style>
</head>
<body>
<div class="app" id="app">
  <div id="sidebar-root" class="dark"></div>
  <main class="main">
    <section class="canvas" id="business-workspace-root" aria-label="기업 작업 미리보기"></section>
<nav class="bottom-dock-wrap" id="user-dock" aria-label="기업 작업 메뉴 미리보기">
  <div class="bottom-dock" role="tablist" aria-label="기업의 기관 상태, 키 관리, Proof 발행, 발행 목록, 작업 이력">
    <button class="dock-item active" role="tab" aria-selected="true" data-dock="status"><span class="dock-icon">⌂</span>기관 상태</button>
    <button class="dock-item" role="tab" aria-selected="false" data-dock="keys"><span class="dock-icon">⚿</span>키 관리</button>
    <button class="dock-item" role="tab" aria-selected="false" data-dock="issue"><span class="dock-icon">＋</span>Proof 발행</button>
    <button class="dock-item" role="tab" aria-selected="false" data-dock="proofs"><span class="dock-icon">▤</span>발행 목록</button>
    <button class="dock-item" role="tab" aria-selected="false" data-dock="operations"><span class="dock-icon">↺</span>작업 이력</button>
  </div>
</nav>
  </main>
</div>

<script>
function selectAction(key,proofId){document.querySelectorAll(".dock-item").forEach(button=>{const active=button.dataset.dock===key;button.classList.toggle("active",active);button.setAttribute("aria-selected",String(active))});window.dispatchEvent(new CustomEvent("originproof-action",{detail:{key,proofId}}))}
function showLanding(){window.location.href="index.html"}
document.querySelectorAll("[data-dock]").forEach(button=>button.addEventListener("click",()=>selectAction(button.dataset.dock)));
</script>
<script src="business.bundle.js"></script>
</body>
</html>
